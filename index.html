<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Whirl — Standalone</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#30364b,#11131b 70%);color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}.app{width:min(900px,94vw);padding:24px}.panel{background:#1b1f2c;border:1px solid #3c435b;border-radius:24px;padding:clamp(20px,5vw,44px);box-shadow:0 20px 60px #0008;text-align:center}.hidden{display:none}h1{font-size:clamp(40px,9vw,82px);margin:0;letter-spacing:.08em}.tag{opacity:.75;margin-bottom:40px}.mode-row,.controls,.rack{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.mode,button{border:0;border-radius:14px;padding:14px 20px;font-size:18px;font-weight:700;cursor:pointer;background:#353c52;color:white}.mode{min-width:150px;padding:24px}.mode:hover,button:hover{filter:brightness(1.18)}.primary{background:#e4b64e;color:#191919}.small{opacity:.6;margin-top:30px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.smallbtn{font-size:14px;padding:8px 12px}.word-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:24px 0;min-height:120px}.slot{background:#10131c;border-radius:10px;padding:10px;font-family:monospace;font-size:20px;letter-spacing:.12em}.slot.found{background:#284638}.current{height:54px;margin:14px;font-size:36px;font-weight:800;letter-spacing:.12em}.tile{width:64px;height:70px;border-radius:14px;background:#f1f0e7;color:#171923;display:grid;place-items:center;font-size:32px;font-weight:900;box-shadow:0 5px 0 #999;user-select:none}.tile.used{opacity:.25;transform:translateY(4px)}.message{min-height:28px;color:#f1cd75;font-weight:700}.controls{margin-top:26px}@media(max-width:520px){.tile{width:52px;height:60px}.controls button{font-size:15px;padding:12px}.panel{padding:18px}}
</style>
</head>
<body>
<main class="app">
<section id="menu" class="panel">
<h1>WORD WHIRL</h1>
<p class="tag">Unscramble. Discover. Keep the whirl going.</p>
<h2>Choose a word size</h2>
<div class="mode-row">
<button class="mode" data-size="4">4-Letter</button>
<button class="mode" data-size="5">5-Letter</button>
<button class="mode" data-size="6">6-Letter</button>
</div>
<p class="small">Standalone HTML • No installation • Works offline</p>
</section>
<section id="game" class="panel hidden">
<header><button id="home" class="smallbtn">Menu</button><div>Score <strong id="score">0</strong></div><div>Hints <strong id="hints">3</strong></div><div>Time <strong id="time">120</strong></div></header>
<h2 id="modeTitle"></h2>
<div id="wordBoard" class="word-board"></div>
<div id="message" class="message">Find the words!</div>
<div id="current" class="current">&nbsp;</div>
<div id="rack" class="rack"></div>
<div class="controls"><button id="shuffle">Shuffle</button><button id="clear">Clear</button><button id="hint">Hint</button><button id="submit" class="primary">Submit</button></div>
<p class="small">Type letters • Backspace clears • Enter submits • Space shuffles</p>
</section></main>
<script>
var PUZZLES={
4:[{rack:"EAST",words:["EAST","EATS","SEAT","TEAS"],bonus:["ATE","EAT","SEA","TEA","SET"]},{rack:"STOP",words:["POST","POTS","SPOT","STOP","TOPS"],bonus:["OPT","POT","TOP","SOP"]},{rack:"CARE",words:["ACRE","CARE","RACE"],bonus:["ACE","ARC","ARE","CAR","EAR","ERA"]}],
5:[{rack:"HEART",words:["EARTH","HEART","HATER"],bonus:["HEAR","HEAT","RATE","TEAR","HARE"]},{rack:"STONE",words:["NOTES","ONSET","STONE","TONES"],bonus:["NOTE","TONE","ONES","NEST"]},{rack:"LEAST",words:["LEAST","SLATE","STALE","STEAL","TALES"],bonus:["SALE","SEAT","TALE","TEAL"]}],
6:[{rack:"STREAM",words:["MASTER","STREAM","TAMERS"],bonus:["STEAM","TEAMS","TERMS","SMART","MARES"]},{rack:"LISTEN",words:["ENLIST","LISTEN","SILENT","TINSEL"],bonus:["LINES","TILES","TINES","ISLET"]},{rack:"PLANET",words:["PLANET","PLATEN"],bonus:["PANEL","PLANE","PLANT","PLEAT","LEAPT"]}]
};
var state={size:4,score:0,hints:3,time:120,current:"",used:[],found:{},puzzle:null,timer:null};
function el(id){return document.getElementById(id)}
function hasFound(w){return !!state.found[w]}
function savedGet(k){try{return window.localStorage?localStorage.getItem(k):null}catch(e){return null}}
function savedSet(k,v){try{if(window.localStorage)localStorage.setItem(k,v)}catch(e){}}
function bind(){
 var modes=document.getElementsByClassName("mode");
 for(var i=0;i<modes.length;i++){modes[i].onclick=function(){start(parseInt(this.getAttribute("data-size"),10))}}
 el("home").onclick=home; el("clear").onclick=clearCurrent; el("shuffle").onclick=shuffle; el("submit").onclick=submit; el("hint").onclick=hint;
 document.onkeydown=keyHandler;
}
function home(){if(state.timer)clearInterval(state.timer);el("game").className="panel hidden";el("menu").className="panel"}
function start(size){
 state.size=size;state.score=parseInt(savedGet("ww_score_"+size)||"0",10);state.hints=3;
 el("menu").className="panel hidden";el("game").className="panel";el("modeTitle").innerHTML=size+"-Letter";
 nextPuzzle();if(state.timer)clearInterval(state.timer);state.time=120;tick();
 state.timer=setInterval(function(){state.time--;tick();if(state.time<=0){clearInterval(state.timer);msg("Time! Starting a new round...");setTimeout(function(){start(size)},1200)}},1000);
}
function nextPuzzle(){
 var arr=PUZZLES[state.size],p=arr[Math.floor(Math.random()*arr.length)],tries=0;
 while(state.puzzle&&p.rack===state.puzzle.rack&&arr.length>1&&tries<10){p=arr[Math.floor(Math.random()*arr.length)];tries++}
 state.puzzle={rack:p.rack,words:p.words.slice(0),bonus:p.bonus.slice(0)};state.found={};state.current="";state.used=[];
 renderBoard();renderRack();update();msg("Find all required words!");
}
function renderBoard(){
 var board=el("wordBoard");board.innerHTML="";
 var words=state.puzzle.words.slice(0).sort();
 for(var i=0;i<words.length;i++){var w=words[i],d=document.createElement("div");d.className="slot"+(hasFound(w)?" found":"");d.innerHTML=hasFound(w)?w:underscores(w.length);board.appendChild(d)}
}
function underscores(n){var s="";for(var i=0;i<n;i++)s+="_ ";return s}
function renderRack(){
 var rack=el("rack");rack.innerHTML="";
 if(!state.puzzle)return;
 for(var i=0;i<state.puzzle.rack.length;i++){(function(index){var b=document.createElement("button");b.type="button";b.className="tile"+(contains(state.used,index)?" used":"");b.innerHTML=state.puzzle.rack.charAt(index);b.onclick=function(){pick(index)};rack.appendChild(b)})(i)}
}
function contains(a,v){for(var i=0;i<a.length;i++)if(a[i]===v)return true;return false}
function wordContains(a,v){for(var i=0;i<a.length;i++)if(a[i]===v)return true;return false}
function pick(i){if(contains(state.used,i))return;state.used.push(i);state.current+=state.puzzle.rack.charAt(i);renderRack();update()}
function clearCurrent(){state.current="";state.used=[];renderRack();update()}
function shuffle(){
 var a=state.puzzle.rack.split("");
 for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
 state.puzzle.rack=a.join("");clearCurrent();
}
function countFound(){var n=0;for(var k in state.found)if(state.found.hasOwnProperty(k)&&state.found[k])n++;return n}
function submit(){
 var w=state.current.toUpperCase();if(!w)return;
 if(hasFound(w))msg("Already found!");
 else if(wordContains(state.puzzle.words,w)){state.found[w]=true;state.score+=w.length*10;msg("Nice! +"+(w.length*10));renderBoard();save();if(countFound()===state.puzzle.words.length){state.score+=100;save();msg("Round complete! +100");setTimeout(nextPuzzle,900)}}
 else if(wordContains(state.puzzle.bonus,w)){state.score+=w.length*5;msg("Bonus word! +"+(w.length*5));save()}
 else msg("Not in this puzzle.");
 clearCurrent();update();
}
function hint(){
 if(state.hints<=0){msg("No hints remaining.");return}
 var left=[];for(var i=0;i<state.puzzle.words.length;i++)if(!hasFound(state.puzzle.words[i]))left.push(state.puzzle.words[i]);
 if(!left.length)return;var w=left[Math.floor(Math.random()*left.length)];state.hints--;msg("Hint: "+w.charAt(0)+" "+underscores(w.length-1));update();
}
function update(){el("score").innerHTML=state.score;el("hints").innerHTML=state.hints;el("current").innerHTML=state.current||"&nbsp;"}
function tick(){el("time").innerHTML=state.time}
function msg(t){el("message").innerHTML=t}
function save(){savedSet("ww_score_"+state.size,state.score)}
function keyHandler(e){
 e=e||window.event;if(el("game").className.indexOf("hidden")>=0)return;
 var key=e.key||"";
 if(key==="Enter")submit();else if(key==="Backspace"){clearCurrent();return false}else if(key===" "){shuffle();return false}
 else if(key.length===1&&/[a-z]/i.test(key)){var c=key.toUpperCase();for(var i=0;i<state.puzzle.rack.length;i++){if(state.puzzle.rack.charAt(i)===c&&!contains(state.used,i)){pick(i);break}}}
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",bind,false)}else{bind()}
</script>
</body></html>
